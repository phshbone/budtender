<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Budtender 🌿</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e0f0d;
      --surface: #161814;
      --surface2: #1e201b;
      --border: #2a2d26;
      --green: #7fff5f;
      --green-dim: #3d7a2b;
      --yellow: #e8c84a;
      --text: #e8ead4;
      --text-dim: #7a7d6e;
      --med-color: #5dba7d;
      --adult-color: #e8c84a;
      --flower-color: #c17f3b;
      --vape-color: #5b9bd5;
      --radius: 16px;
      --card-radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(14, 15, 13, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--green);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo span { font-size: 20px; }

    .last-updated {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      text-align: right;
      line-height: 1.4;
    }

    .last-updated strong {
      display: block;
      color: var(--green);
      font-size: 11px;
    }

    /* ── FILTERS ── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      gap: 6px;
    }

    .pill {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }

    .pill.active {
      border-color: var(--green);
      background: rgba(127, 255, 95, 0.12);
      color: var(--green);
    }

    .pill.price-pill.active {
      border-color: var(--yellow);
      background: rgba(232, 200, 74, 0.12);
      color: var(--yellow);
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stats-bar::-webkit-scrollbar { display: none; }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .stat-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── DISPENSARY SECTIONS ── */
    .section {
      padding: 0 16px;
      margin-top: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-badge {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-med {
      background: rgba(93, 186, 125, 0.15);
      color: var(--med-color);
      border: 1px solid rgba(93, 186, 125, 0.3);
    }

    .badge-adult {
      background: rgba(232, 200, 74, 0.15);
      color: var(--adult-color);
      border: 1px solid rgba(232, 200, 74, 0.3);
    }

    .section-count {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .deal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
      display: block;
      position: relative;
    }

    .deal-card:active {
      transform: scale(0.97);
    }

    .deal-card:hover {
      border-color: #3a3d36;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: var(--surface2);
      overflow: hidden;
    }

    .card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .card-img-wrap img.loading {
      opacity: 0;
    }

    .img-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .cat-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cat-flower {
      background: rgba(193, 127, 59, 0.85);
      color: #fff;
    }

    .cat-vape {
      background: rgba(91, 155, 213, 0.85);
      color: #fff;
    }

    .card-body {
      padding: 10px 10px 11px;
    }

    .card-price {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--green);
      line-height: 1;
      margin-bottom: 5px;
    }

    .card-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 32px;
      color: var(--text-dim);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }

    .empty-state h3 {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 13px;
      line-height: 1.6;
    }

    /* ── LOADING ── */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── NO DEALS ── */
    .no-deals-section {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--card-radius);
      padding: 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'DM Mono', monospace;
    }

    /* ── REFRESH BTN ── */
    .refresh-hint {
      text-align: center;
      padding: 24px 16px 0;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .refresh-hint a {
      color: var(--green);
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo"><span>🌿</span> Budtender</div>
    <div class="last-updated" id="lastUpdated">
      <strong>Loading...</strong>
    </div>
  </div>
  <div class="filters">
    <div class="filter-group">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="flower">🌸 Flower</button>
      <button class="pill" data-filter="vape">💨 Vape</button>
    </div>
    <div class="filter-group">
      <button class="pill price-pill active" data-price="20">Under $20</button>
      <button class="pill price-pill" data-price="25">Under $25</button>
    </div>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div id="app">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">fetching deals...</div>
  </div>
</div>

<div class="refresh-hint">
  Refreshes automatically 3× daily &nbsp;·&nbsp;
  <a href="javascript:location.reload()">tap to reload</a>
</div>

<script>
  const DISPENSARY_ORDER = [
    "Kind Kush Rockaway",
    "RISE Paterson",
    "AYR Union",
    "Apothecarium Maplewood",
    "Ascend Wharton"
  ];

  let allProducts = [];
  let activeFilter = 'all';
  let activePrice = 20;

  // ── FETCH DATA ──
  async function loadDeals() {
    try {
      const res = await fetch('deals.json?t=' + Date.now());
      const data = await res.json();
      allProducts = data.products || [];

      const lu = document.getElementById('lastUpdated');
      lu.innerHTML = `<strong>${allProducts.length} deals found</strong>${data.last_updated}`;

      renderStats();
      renderDeals();
    } catch (e) {
      document.getElementById('app').innerHTML = `
        <div class="empty-state">
          <span class="icon">⚠️</span>
          <h3>Couldn't load deals</h3>
          <p>deals.json not found yet.<br>Run the scraper first or wait for the first scheduled run.</p>
        </div>`;
    }
  }

  // ── STATS BAR ──
  function renderStats() {
    const dispensaries = [...new Set(allProducts.map(p => p.dispensary))];
    const statColors = {
      'Kind Kush Rockaway': '#e8c84a',
      'RISE Paterson': '#5dba7d',
      'AYR Union': '#5b9bd5',
      'Apothecarium Maplewood': '#c1845a',
      'Ascend Wharton': '#9b7fd4'
    };

    const bar = document.getElementById('statsBar');
    bar.innerHTML = dispensaries.map(d => {
      const count = allProducts.filter(p => p.dispensary === d).length;
      const color = statColors[d] || '#7a7d6e';
      return `<div class="stat-chip">
        <div class="stat-dot" style="background:${color}"></div>
        ${d.split(' ')[0]} · ${count}
      </div>`;
    }).join('');
  }

  // ── RENDER DEALS ──
  function renderDeals() {
    const filtered = allProducts.filter(p => {
      const catMatch = activeFilter === 'all' || p.category === activeFilter;
      const priceMatch = p.price <= activePrice;
      return catMatch && priceMatch;
    });

    const app = document.getElementById('app');

    if (filtered.length === 0) {
      app.innerHTML = `
        <div class="empty-state">
          <span class="icon">🍃</span>
          <h3>No deals right now</h3>
          <p>Nothing under $${activePrice} for that category.<br>Try $25 or check back after the next scrape.</p>
        </div>`;
      return;
    }

    // Group by dispensary
    const byDispensary = {};
    DISPENSARY_ORDER.forEach(d => { byDispensary[d] = []; });
    filtered.forEach(p => {
      if (!byDispensary[p.dispensary]) byDispensary[p.dispensary] = [];
      byDispensary[p.dispensary].push(p);
    });

    const dispensaryColors = {
      'Kind Kush Rockaway': '#e8c84a',
      'RISE Paterson': '#5dba7d',
      'AYR Union': '#5b9bd5',
      'Apothecarium Maplewood': '#c1845a',
      'Ascend Wharton': '#9b7fd4'
    };

    let html = '';

    DISPENSARY_ORDER.forEach(dName => {
      const products = byDispensary[dName];
      if (!products) return;

      const badgeClass = products[0]?.badge === 'med' ? 'badge-med' : 'badge-adult';
      const badgeLabel = products[0]?.label || '';
      const dotColor = dispensaryColors[dName] || '#7a7d6e';
      const count = products.length;

      html += `<div class="section">
        <div class="section-header">
          <div class="section-name">
            <div class="stat-dot" style="background:${dotColor};width:9px;height:9px;border-radius:50%;flex-shrink:0"></div>
            ${dName}
            <span class="section-badge ${badgeClass}">${badgeLabel}</span>
          </div>
          <div class="section-count">${count} deal${count !== 1 ? 's' : ''}</div>
        </div>`;

      if (count === 0) {
        html += `<div class="no-deals-section">no deals under $${activePrice}</div>`;
      } else {
        html += `<div class="card-grid">`;
        products.forEach(p => {
          const catClass = p.category === 'flower' ? 'cat-flower' : 'cat-vape';
          const catLabel = p.category === 'flower' ? '🌸 Flower' : '💨 Vape';
          const emoji = p.category === 'flower' ? '🌿' : '💨';
          const hasImg = p.image && p.image.length > 5;

          html += `<a class="deal-card" href="${p.link || '#'}" target="_blank" rel="noopener">
            <div class="card-img-wrap">
              ${hasImg
                ? `<img src="${p.image}" alt="${p.name}" class="loading" onload="this.classList.remove('loading')" onerror="this.style.display='none'" />`
                : ''}
              <div class="img-placeholder">${emoji}</div>
              <div class="cat-tag ${catClass}">${catLabel}</div>
            </div>
            <div class="card-body">
              <div class="card-price">$${p.price.toFixed(0)}</div>
              <div class="card-name">${p.name}</div>
            </div>
          </a>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
    });

    app.innerHTML = html;
  }

  // ── FILTER CONTROLS ──
  document.querySelectorAll('.pill[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill[data-filter]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      renderDeals();
    });
  });

  document.querySelectorAll('.pill[data-price]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill[data-price]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activePrice = parseInt(btn.dataset.price);
      renderDeals();
    });
  });

  // ── INIT ──
  loadDeals();
</script>
</body>
</html>
