name: Budtender Scraper
on:
  schedule:
    - cron: '1 0,6,12,16 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      - name: Scrape
        run: python scraper.py
      - name: Save
        run: |
          git config --global user.name "Budtender Bot"
          git config --global user.email "bot@budtender"
          git add deals.json
          git diff --staged --quiet || git commit -m "update"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
